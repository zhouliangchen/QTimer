name: Build and Release 超智能计时器

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run PyInstaller
        shell: pwsh
        run: |
          python scripts/build_windows.py

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          # 动态获取当前触发的版本号 (如 v1.3.2)
          $VER = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") {
              $shortSha = "${{ github.sha }}".Substring(0, 7)
              $VER = "v-dev-$shortSha"
          } elseif (-not $VER.StartsWith("v")) {
              $VER = "v$VER"
          }

          New-Item -ItemType Directory -Force -Path "out"

          # 1. 将 dist/超智能计时器.exe 重命名为 超智能计时器_v1.3.2.exe
          $EXE_NAME = "超智能计时器_${VER}.exe"
          Rename-Item -Path "dist/超智能计时器.exe" -NewName $EXE_NAME

          # 2. 压缩包名称设置为 超智能计时器_v1.3.2.zip
          $ZIP_NAME = "超智能计时器_${VER}.zip"

          # 3. 把重命名后的 超智能计时器_v1.3.2.exe 压缩进 超智能计时器_v1.3.2.zip
          Compress-Archive -Path "dist/$EXE_NAME" -DestinationPath "out/$ZIP_NAME"

          # 生成 SHA256 校验文件
          Get-FileHash -Path "out/$ZIP_NAME" -Algorithm SHA256 | Out-File -FilePath "out/sha256sum.txt"

          Write-Host "Files created successfully in ./out:"
          Get-ChildItem "out"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QTimer-Build-Asset
          path: out/*
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: QTimer-Build-Asset
          path: ./release_files

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          name: 超智能计时器 ${{ github.ref_name }}
          body: |
            ## 🚀 超智能计时器 ${{ github.ref_name }}

            ### 📦 下载链接
            - **绿色便携包**: `超智能计时器_${{ github.ref_name }}.zip`

            ### 🔒 文件校验 (SHA-256)
            您可以查阅附件中的 `sha256sum.txt` 校验下载包的完整性。

            ---
            *此 Release 由 GitHub Actions 自动打包发布。*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
